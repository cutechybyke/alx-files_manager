name: Python CLI CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cli.txt
      - run: pip install -r requirements-cli.txt
      - run: python -m unittest -v test_image_upload.py
